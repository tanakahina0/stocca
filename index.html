<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストッカ | Stocca</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="desktop-message">
        <h1>ストッカ</h1>
        <p>当サービスはスマートフォン専用です。</p>
    </div>
    
    <div id="app" class="app-container"></div>
    
    <div id="custom-modal" class="modal-overlay"></div>
    
    <div id="toast" class="toast-container"></div>

    <nav class="bottom-nav">
        <button class="nav-btn" data-page="home" onclick="router('home')">
            <span class="nav-icon">🏠</span><br>ホーム
        </button>
        <button class="nav-btn" data-page="recipeList" onclick="router('recipeList')">
            <span class="nav-icon">🍲</span><br>レシピ
        </button>
        
        <button class="fab-nav" onclick="addList()"><div class="plus-icon"></div></button>
        
        <button class="nav-btn" data-page="shopping" onclick="router('shopping')">
            <span class="nav-icon">🛒</span><br>買い物
        </button>
        <button class="nav-btn" data-page="menu" onclick="router('menu')">
            <span class="nav-icon">≡</span><br>メニュー
        </button>
    </nav>
    <script src="./js/script.js"></script>
